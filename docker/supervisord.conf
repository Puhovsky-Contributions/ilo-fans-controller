[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/apache2.err.log
stdout_logfile=/var/log/supervisor/apache2.out.log

[program:fan-daemon-server1]
command=php /var/www/html/fan-daemon.php server1
autostart=true
autorestart=true
stderr_logfile=/var/log/supervisor/fan-daemon-server1.err.log
stdout_logfile=/var/log/supervisor/fan-daemon-server1.out.log
user=www-data

